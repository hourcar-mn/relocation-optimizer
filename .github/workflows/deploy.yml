name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:

# a second push to main shouldn't race the first one's rollout
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: npm ci

      - name: Typecheck Worker
        run: npx tsc --noEmit

      # every tests/test_*.py is a plain assert script with a __main__ block, so
      # the loop picks up new ones without editing this file again
      - name: Run tests
        run: |
          pip install -r requirements.txt
          for f in tests/test_*.py; do echo "== $f"; python "$f"; done

      - name: Build frontend
        run: npm run build

      # the deploy below builds the image itself, so this only earns its keep on
      # PRs — where it's the one thing that catches a broken Dockerfile
      - name: Build container image
        if: github.event_name == 'pull_request'
        run: docker build -t relocation-optimizer .

      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
